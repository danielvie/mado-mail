version: '3'

tasks:
  default:
    desc: List tasks
    cmds: [task --list]

  run:
    desc: Run with Gmail
    cmds: [cargo run --release --locked]

  demo:
    desc: Run with synthetic mail
    cmds: [cargo run --release --locked -- --demo]

  build:
    desc: Build release executable
    cmds: [cargo build --release --locked]

  install:
    desc: Build release and install to ~/.local/bin
    aliases: [i]
    deps: [build]
    cmds:
      - cmd: >-
          powershell.exe -NoProfile -Command '$ErrorActionPreference = "Stop";
          New-Item -ItemType Directory -Force "$HOME/.local/bin" | Out-Null;
          Copy-Item "target/release/mado-mail.exe" "$HOME/.local/bin/mado-mail.exe" -Force'
        platforms: [windows]
      - cmd: mkdir -p "$HOME/.local/bin" && install -m 755 target/release/mado-mail "$HOME/.local/bin/mado-mail"
        platforms: [darwin]

  reader-check:
    desc: Offline native macOS reader/security regression (no Gmail)
    platforms: [darwin]
    deps: [build]
    cmds: [python3 scripts/check-macos-reader.py]

  check:
    desc: Check all Rust targets against the locked dependencies
    cmds: [cargo check --all-targets --locked]

  test:
    desc: Run Rust tests
    cmds: [cargo test --locked]

  clean:
    desc: Remove Rust build artifacts
    cmds: [cargo clean]
